blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/monikapurpl3/breeze/security/advisories/new
    about: Please report vulnerabilities privately (see SECURITY.md) — not as public issues.
  - name: Breeze Core (server / API) issues
    url: https://github.com/monikapurpl3/breeze-core/issues
    about: Bugs or requests for the server/API belong in the breeze-core repo.
  - name: Get the latest APK
    url: https://bolero.salataputarica.hr.eu.org/android/
    about: Releases are also on the package host, with a sha256 beside each build.
  - name: Android Auto won't show the app?
    url: https://github.com/monikapurpl3/breeze#android-auto
    about: Needs developer mode plus Unknown sources in Android Auto; the README covers what else to check.
