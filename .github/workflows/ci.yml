name: CI

on:
  push:
    branches: [main]
  pull_request:

# This job checks out the code, analyses it and runs the tests -- it writes
# nothing back, so read-only is the whole requirement. Declared explicitly
# because a workflow with no permissions block inherits whatever the repository
# default happens to be, which is broader than this needs.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
