name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The iOS workflow runs this first, so a Dart mistake fails in a minute on
  # Linux rather than after a macOS build.
  workflow_call:

# This job checks out the code, analyses it and runs the tests -- it writes
# nothing back, so read-only is the whole requirement. Declared explicitly
# because a workflow with no permissions block inherits whatever the repository
# default happens to be, which is broader than this needs.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # The version the releases are built with, moved here and on the
          # build machine together. Unpinned, CI met each new stable before
          # the app did: analyze failed 2.5.0 on 3.47's deprecation of
          # package:flutter/material.dart. Since 2.6.0 the app imports
          # package:material_ui instead and is built with this version.
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
