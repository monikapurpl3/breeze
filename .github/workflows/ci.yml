name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The iOS workflow runs this first, so a Dart mistake fails in a minute on
  # Linux rather than after a macOS build.
  workflow_call:

# This job checks out the code, analyses it and runs the tests -- it writes
# nothing back, so read-only is the whole requirement. Declared explicitly
# because a workflow with no permissions block inherits whatever the repository
# default happens to be, which is broader than this needs.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # The version the releases are built with. Unpinned, CI met each new
          # stable before the app did: 3.47 deprecates importing
          # package:flutter/material.dart, every file here does, and analyze
          # failed a release that 3.44.4 built cleanly. Moving Flutter is its
          # own change, made here and on the build machine together.
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
