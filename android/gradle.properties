# The Flutter template ships `-Xmx8G -XX:MaxMetaspaceSize=4G`, which is sized
# for a large multi-module app, not this one. The Gradle daemon grows its heap
# to fit whatever it is allowed and then *keeps* it for the daemon's lifetime,
# so a single `flutter build apk` here left a ~5 GB JVM resident long after the
# build had finished. 2 GB builds this project comfortably — three plugins and
# no native code of its own.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# And don't sit on that memory all afternoon: exit after 10 minutes idle
# instead of the 3-hour default. Rebuilds within a session still reuse it.
org.gradle.daemon.idletimeout=600000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
